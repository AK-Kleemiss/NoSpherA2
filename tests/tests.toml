# Uses sto-3g (not the def2-svp default) to keep CI resource usage
# reasonable: def2-svp for this 23-atom/3215-reflection system needs a
# multi-GB I-tensor and ~80s+ of integral evaluation, which reliably
# std::bad_alloc'd on memory-constrained Linux CI runners and timed out on
# Windows CI (dragging even unrelated tests past their timeout). sto-3g has
# far fewer basis functions, cutting both memory and runtime substantially;
# this also exercises the STO-3G L-shell fix (see UNIT_TESTS_STATUS.md) as a
# real regression test, not just a manual smoke test.
#
# Every XCW test below pins no_gpu, for the reference output rather than for speed. The I
# tensor runs on the device by default now, and the device answer differs from the CPU one
# in the tenth significant figure - enough to change these logs. Left unpinned, each would
# pass on a machine with no usable GPU and fail on one with a card, which is the same trap
# the fp32/fp64 tests further down already document. P1_test_XCW_gpu_itensor is the
# deliberate exception and carries its own reference.

[P1_test_XCW]
directory = "P1_test"
good = "P1_test_XCW.good"

[P1_test_XCW.args]
do_XCW = ""
no_gpu = ""
cif = "P1_test_NA2.cif"
hkl = "P1_test.hkl"
anom_disp = "anom_disp.txt"
XCW_settings = "test_settings.txt"
no_date = ""

# Longer lambda scan exercising the Gaussian halting criterion over a real
# trajectory. Slow (several minutes); only run with RUN_FULL_TEST=1, see
# tests/src/IntegrationTests.cpp.

[P1_test_XCW_full]
directory = "P1_test"
good = "P1_test_XCW_full.good"
full = true

[P1_test_XCW_full.args]
do_XCW = ""
no_gpu = ""
xcw_gaussian_halt = ""
cif = "P1_test_NA2.cif"
hkl = "P1_test.hkl"
anom_disp = "anom_disp.txt"
XCW_settings = "test_settings.txt"
no_date = ""

# h2_weighting variant of P1_test_XCW: fits against the 1/|H|^2-weighted
# residual self-energy criterion instead of the classical GoF^2.

