# GPU variants. These run only when a device is present; the test skips otherwise, so
# the suite stays green on a CPU-only machine. The grid-weight path is bit-identical to
# the CPU, so it reuses the CPU reference; the I tensor path is single-precision and
# carries its own.

# Its own reference rather than the CPU one, and deliberately so. The weights themselves
# are bit-identical - the only line that differs is the note saying the device ran them -
# but that note is the test's real assertion. Held to the shared CPU reference this test
# passed for a whole session while the kernel was failing its chi copy and falling back,
# because a silent fallback produces exactly the CPU reference. The reference has to
# contain the evidence that the GPU did the work.
#
# The note names the backend, so a HIP build needs its own copy of this file. Regenerate it
# there rather than editing CUDA out of this one: run the case, confirm the only line that
# differs from sucrose_SF.good is the note, and save the resulting NoSpherA2.log. Hand-editing
# the backend name would produce a reference nobody has ever seen a run match.
[sucrose_SF_gpu_grid]
directory = "sucrose_fchk_SF"
good = "sucrose_SF_gpu_grid.good"

[sucrose_SF_gpu_grid.args]
cif = "sucrose.cif"
hkl = "olex2/Wfn_job/sucrose.hkl"
wfn = "olex2/Wfn_job/sucrose.wfx"
acc = 1
gpu_grid = ""

[P1_test_XCW_gpu_itensor]
directory = "P1_test"
good = "P1_test_XCW_gpu_itensor.good"

[P1_test_XCW_gpu_itensor.args]
do_XCW = ""
cif = "P1_test_NA2.cif"
hkl = "P1_test.hkl"
anom_disp = "anom_disp.txt"
XCW_settings = "test_settings.txt"
no_date = ""
gpu_itensor = ""

# The two sincos kernels, each pinned rather than left to the card. Without the explicit
# flags the precision a run gets depends on the reported fp32:fp64 ratio, so on a consumer
# part both of these would be the f32 kernel and on a V100 both would be the f64 one - the
# suite would report two passes having tested one path twice.
#
# Both are held to the same CPU reference, which is the point: the f64 kernel agrees to
# ~1e-14 and the reduced-argument f32 one to ~2e-8, and both are inside what the reference
# comparison accepts. That is the numerical-agreement contract in AGENTS.md, checked.

[sucrose_SF_gpu_fp64]
directory = "sucrose_fchk_SF"
good = "sucrose_SF.good"

[sucrose_SF_gpu_fp64.args]
cif = "sucrose.cif"
hkl = "olex2/Wfn_job/sucrose.hkl"
wfn = "olex2/Wfn_job/sucrose.wfx"
acc = 1
gpu_fp64 = ""

