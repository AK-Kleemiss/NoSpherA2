no_date = ""

# h2_weighting variant of P1_test_XCW_full, same RUN_FULL_TEST gating,
# but capped at lambda=0.08 rather than 0.1: the 1/|H|^2-weighted SCF
# genuinely fails to converge by lambda=0.10 for this system (iteration
# count escalates sharply from 33 at 0.08 to 55 at 0.09 to non-convergence
# at 0.10, within the default 100-iteration cap) -- a real numerical
# instability of this weighting at higher lambda, not a test/code bug. See
# UNIT_TESTS_STATUS.md Known Issues.

[P1_test_XCW_h2_full]
directory = "P1_test"
good = "P1_test_XCW_h2_full.good"
full = true

[P1_test_XCW_h2_full.args]
