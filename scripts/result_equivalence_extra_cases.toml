# Extra cases for scripts/result_equivalence.py, covering flags tests/tests.toml does not use. Same format as tests/tests.toml;
# the harness prepends -cpus N and the [defaults] of tests.toml. Each case ran twice with master d624d8c4 and its outputs
# matched (timing fields masked by the harness); commented-out cases at the end are not reproducible in master.
[nbo_nh3bh3]
directory = "RGBI_groups"
[nbo_nh3bh3.args]
nbo = "nh3bh3.gbw"

[nbo_native_nrt_allyl]
